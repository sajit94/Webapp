<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goa Trip - Aug 13th 🏖️</title>
  <style>
    :root {
      --primary: #ff007f;
      --secondary: #00f0ff;
      --bg: #0d0a1a;
      --card-bg: rgba(255, 255, 255, 0.07);
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d0a1a 0%, #1f1147 50%, #3a0057 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 10px;
    }
    h1 {
      font-size: 3rem;
      background: linear-gradient(45deg, #ff007f, #ffaa00, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      margin-bottom: 5px;
    }
    .countdown {
      font-size: 1.2rem;
      color: #00f0ff;
      letter-spacing: 2px;
      font-weight: bold;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 1.8rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      margin-top: 40px;
      color: var(--secondary);
    }
    /* Crew Grid */
    .crew-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .crew-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .crew-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px var(--primary);
    }
    /* Upload Section */
    .upload-box {
      background: var(--card-bg);
      border: 2px dashed var(--secondary);
      border-radius: 16px;
      padding: 25px;
      margin-top: 20px;
      text-align: center;
    }
    select, input[type="text"], input[type="file"], button {
      margin: 10px 5px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    select, input[type="text"] {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 200px;
    }
    button {
      background: linear-gradient(45deg, var(--primary), #ffaa00);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      box-shadow: 0 0 15px var(--primary);
    }
    /* Dynamic Photo Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .photo-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.4s ease;
    }
    .photo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: filter 0.4s;
    }
    .photo-card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
    }
    .photo-info {
      padding: 10px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 0.9rem;
    }
    .uploader-badge {
      color: var(--secondary);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>GOA TRIP 2026 🌊</h1>
    <div class="countdown">COUNTDOWN TO AUGUST 13TH 🚀</div>
  </header>

  <div class="container">
    <h2 class="section-title">The Squad</h2>
    <div class="crew-grid" id="crewGrid"></div>

    <h2 class="section-title">Upload Trip Memories</h2>
    <div class="upload-box">
      <form id="uploadForm">
        <select id="uploaderSelect" required>
          <option value="">Select Who You Are</option>
        </select>
        <input type="text" id="captionInput" placeholder="Add a caption..." required>
        <input type="file" id="photoInput" accept="image/*" required>
        <button type="submit">Upload Memory 📸</button>
      </form>
    </div>

    <h2 class="section-title">Memory Wall</h2>
    <div class="gallery" id="photoGallery"></div>
  </div>

  <script>
    // Load Squad Members
    async function loadCrew() {
      const res = await fetch('/api/crew');
      const crew = await res.json();
      const grid = document.getElementById('crewGrid');
      const select = document.getElementById('uploaderSelect');
      grid.innerHTML = '';
      
      crew.forEach(member => {
        grid.innerHTML += `<div class="crew-card"><h3>${member.name}</h3><p>${member.status}</p></div>`;
        select.innerHTML += `<option value="${member.name}">${member.name}</option>`;
      });
    }

    // Load Photo Gallery
    async function loadPhotos() {
      const res = await fetch('/api/photos');
      const photos = await res.json();
      const gallery = document.getElementById('photoGallery');
      gallery.innerHTML = '';

      photos.forEach(photo => {
        gallery.innerHTML += `
          <div class="photo-card">
            <img src="${photo.url}" alt="Goa Memory">
            <div class="photo-info">
              <span class="uploader-badge">${photo.uploader}</span>: ${photo.caption}
            </div>
          </div>
        `;
      });
    }

    // Upload Photo
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('uploader', document.getElementById('uploaderSelect').value);
      formData.append('caption', document.getElementById('captionInput').value);
      formData.append('photo', document.getElementById('photoInput').files[0]);

      const res = await fetch('/api/upload', {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        document.getElementById('uploadForm').reset();
        loadPhotos();
      } else {
        alert('Upload failed!');
      }
    });

    loadCrew();
    loadPhotos();
  </script>
</body>
</html>
