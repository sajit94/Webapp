<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goa Trip - Aug 13th 🏖️</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --bg-light: #1e293b;
      --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top right, var(--bg-light), var(--bg-dark) 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 20px 60px 20px;
    }

    header {
      text-align: center;
      padding: 60px 10px 40px;
      animation: fadeInDown 1s ease-out;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }

    .countdown {
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
      margin: 50px 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--glass-border), transparent);
    }

    /* --- SQUAD CARDS --- */
    .crew-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .crew-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 15px;
      text-align: center;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .crew-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .crew-card h3 { margin: 0 0 5px 0; font-size: 1.2rem; font-weight: 600; }
    .crew-card p { margin: 0; font-size: 0.85rem; color: #10b981; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

    /* --- SASSY UPLOAD BOX --- */
    .upload-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }

    select, input[type="text"] {
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 200px;
    }

    select:focus, input[type="text"]:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
    }

    select option { background: var(--bg-dark); color: #fff; }

    /* Hide ugly native file input */
    input[type="file"] { display: none; }

    /* Custom File Upload Button */
    .file-label {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(245, 158, 11, 0.5);
      color: var(--text-main);
      padding: 14px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      text-align: center;
      flex: 1;
      min-width: 200px;
    }

    .file-label:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: #f59e0b;
    }

    /* Submit Button */
    button[type="submit"] {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      flex: 1;
      min-width: 200px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button[type="submit"]:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }

    button[type="submit"]:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* --- GALLERY --- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .photo-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .photo-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .photo-card:hover img { opacity: 1; }

    .photo-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 15px 15px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      font-size: 0.95rem;
    }

    .uploader-badge {
      color: #f59e0b;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 3px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>GOA TRIP 2026</h1>
    <div class="countdown">Countdown to August 13th</div>
  </header>

  <div class="container">
    <h2 class="section-title">The Squad</h2>
    <div class="crew-grid">
      <div class="crew-card"><h3>Sajith</h3><p>Ready</p></div>
      <div class="crew-card"><h3>Noble</h3><p>Ready</p></div>
      <div class="crew-card"><h3>Aslam</h3><p>Ready</p></div>
      <div class="crew-card"><h3>Vishnu</h3><p>Ready</p></div>
      <div class="crew-card"><h3>Ankit</h3><p>Ready</p></div>
      <div class="crew-card"><h3>Sandy</h3><p>Ready</p></div>
    </div>

    <h2 class="section-title">Drop a Memory</h2>
    <div class="upload-box">
      <form id="uploadForm">
        <select id="uploaderSelect" required>
          <option value="" disabled selected>Who's dropping this?</option>
          <option value="Sajith">Sajith</option>
          <option value="Noble">Noble</option>
          <option value="Aslam">Aslam</option>
          <option value="Vishnu">Vishnu</option>
          <option value="Ankit">Ankit</option>
          <option value="Sandy">Sandy</option>
        </select>
        
        <input type="text" id="captionInput" placeholder="Write a classy caption..." required>
        
        <label for="photoInput" class="file-label" id="fileLabel">Tap to select photo 📸</label>
        <input type="file" id="photoInput" accept="image/*" required>
        
        <button type="submit" id="submitBtn">Send It 🚀</button>
      </form>
    </div>

    <h2 class="section-title">Memory Wall</h2>
    <div class="gallery" id="photoGallery"></div>
  </div>

  <script>
    // Update file label when a photo is selected
    document.getElementById('photoInput').addEventListener('change', function(e) {
      const fileName = e.target.files[0]?.name;
      const label = document.getElementById('fileLabel');
      if (fileName) {
        label.innerHTML = `✅ ${fileName} selected!`;
        label.style.borderColor = '#10b981';
        label.style.color = '#10b981';
      } else {
        label.innerHTML = 'Tap to select photo 📸';
        label.style.borderColor = 'rgba(245, 158, 11, 0.5)';
        label.style.color = 'var(--text-main)';
      }
    });

    async function loadPhotos() {
      try {
        const res = await fetch('/api/photos');
        if (!res.ok) throw new Error('Failed to fetch');
        const photos = await res.json();
        const gallery = document.getElementById('photoGallery');
        gallery.innerHTML = '';
        
        photos.forEach(photo => {
          gallery.innerHTML += `
            <div class="photo-card">
              <img src="${photo.url}" alt="Goa Memory" loading="lazy">
              <div class="photo-info">
                <span class="uploader-badge">${photo.uploader}</span>
                ${photo.caption}
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error("Gallery empty or loading error:", err);
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const label = document.getElementById('fileLabel');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = 'UPLOADING... ⏳';
      btn.disabled = true;

      const formData = new FormData();
      formData.append('uploader', document.getElementById('uploaderSelect').value);
      formData.append('caption', document.getElementById('captionInput').value);
      
      // FIXED: Swapped 'photo' to 'file' to match Flask backend requirement
      formData.append('file', document.getElementById('photoInput').files[0]);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          document.getElementById('uploadForm').reset();
          // Reset custom file label styling
          label.innerHTML = 'Tap to select photo 📸';
          label.style.borderColor = 'rgba(245, 158, 11, 0.5)';
          label.style.color = 'var(--text-main)';
          loadPhotos();
        } else {
          alert('Upload failed! Check the backend logs.');
        }
      } catch (err) {
        alert('Network error occurred during upload.');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    loadPhotos();
  </script>
</body>
</html>
